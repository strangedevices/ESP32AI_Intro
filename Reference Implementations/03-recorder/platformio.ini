; Stage 03 - voice recorder (SD WAV) + playback on the stage 02 harness for M5Stack CoreS3 / CoreS3 SE
; Build: pio run     Flash: pio run -t upload     Serial: pio device monitor
; Wi-Fi credentials: copy include/secrets.h.example to include/secrets.h and edit.
;
; Uses the standard 16 MB partition table (6.5 MB app). Flashing this replaces the
; stage 01 partition table, so to go back to the story app run its
; `pio run -t upload_model` again first.
[env:m5stack-cores3]
platform = espressif32@^8.0.0
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default_16MB.csv
lib_deps =
    m5stack/M5Unified@^0.2.29
