; Stage 01 - on-device TinyStories language model for M5Stack CoreS3 / CoreS3 SE
; Build:        pio run
; Flash model:  pio run -t upload_model     (once; 15 MB, ~1 min)
; Flash app:    pio run -t upload
; Serial:       pio device monitor
[env:m5stack-cores3]
platform = espressif32@^8.0.0
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.arduino.memory_type = qio_qspi
board_build.partitions = partitions.csv
board_upload.maximum_size = 1572864
extra_scripts = scripts/upload_model.py
build_unflags = -Os
build_flags = -O3
lib_deps =
    m5stack/M5Unified@^0.2.29
