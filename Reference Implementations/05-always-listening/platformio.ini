; Stage 05 - always-listening assistant with agent tools for M5Stack CoreS3 / CoreS3 SE
; Build: pio run     Flash: pio run -t upload     Serial: pio device monitor
; Credentials: copy ../secrets.h.example to ../secrets.h and edit (shared by all stages).
[env:m5stack-cores3]
platform = espressif32@^8.0.0
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default_16MB.csv
; Shared credentials live one folder up: Reference Implementations/secrets.h
build_flags = -I..
lib_deps =
    m5stack/M5Unified@^0.2.29
    bblanchon/ArduinoJson@^7.2.0
